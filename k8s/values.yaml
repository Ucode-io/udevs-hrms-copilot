# Copy this AND config.json next to it into Ucode-io/deployments as
#   clusters/cluster-prod/ucode-prod/udevs-hrms-copilot/values.yaml
#   clusters/cluster-prod/ucode-prod/udevs-hrms-copilot/config.json
#
# Both files are required: config.json names the Helm chart (microservice_v2)
# the folder is rendered with, and every neighbour in ucode-prod carries one.
#
# The folder name must equal the GitHub repository name: deploy.yml resolves it
# from `github.event.repository.name` and rewrites `image.tag` here on every
# push to main. Without the file the deploy job fails at "Update image tag" —
# which is exactly why pbx-transcript-worker's pipeline is red.
#
# Everything else lives in Vault (see the block above `environment`), so this
# file describes where the service runs and Vault describes how it behaves.
global:
  replicaCount: 1
  environment: {}
replicaCount: 1

image:
  registry: ghcr.io/
  repository: ucode-io/udevs-hrms-copilot
  pullPolicy: IfNotPresent
  # Rewritten by ci-cd on every deploy; the value here only seeds the first one.
  tag: "1"
# ghcr-registry, NOT the gitlab-registry every neighbour in ucode-prod names.
# That secret holds credentials for gitlab.udevs.io:5050 and nothing for
# ghcr.io — the neighbours only pull because their ghcr packages were made
# public, so the anonymous pull succeeds and the wrong secret never shows.
# A new ghcr package is private by default, so this one fails that way with
# "failed to fetch anonymous token: 403 Forbidden", which reads like a missing
# image rather than a missing credential. ghcr-registry is the secret that
# actually carries ghcr.io auth; pbx-transcript-worker and sms pull with it.
imagePullSecrets: "ghcr-registry"
nameOverride: ""
fullnameOverride: ""
labels:
  app: udevs-hrms-copilot

serviceAccount:
  create: true
  annotations: {}
  name: "vault-auth"

# Secrets are injected as a file at /app/.env, and the container is started with
# --env-file-if-exists=/app/.env to read it (see Dockerfile).
#
# Note the `=` in the template below rather than the `: ` other services use.
# Node's --env-file parser reads KEY=value and silently ignores a line without
# an `=`, so a colon-separated file would leave the service running with no
# Anthropic key and no ucode service key — starting cleanly, answering nothing,
# and keeping history in memory. Keep the `=`.
podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/auth-path: "auth/kubernetes-ucode"
  vault.hashicorp.com/agent-inject-secret-.env: "secret/data/k8s/ucode-prod/hrms-copilot"
  vault.hashicorp.com/secret-volume-path-.env: "/app"
  vault.hashicorp.com/role: "ucode-prod"
  vault.hashicorp.com/agent-inject-template-.env: |
    {{- with secret "secret/data/k8s/ucode-prod/hrms-copilot" -}}
    {{- range $key, $value := .Data.data }}
    {{ $key }}={{ $value }}
    {{- end }}
    {{ end -}}
podLabels:
  app: udevs-hrms-copilot
podSecurityContext: {}
securityContext: {}

vault:
  enabled: false
  secretName: vault-secrets
  variables:
    VAULT_TOKEN: vault_token
    SECRETS_PATH:

# Everything the service reads lives in Vault under
# secret/data/k8s/ucode-prod/hrms-copilot and arrives in /app/.env. Expected
# keys, so the repository still states the contract even though the values are
# not here:
#
#   ANTHROPIC_API_KEY        Anthropic key the answers are billed to
#   UCODE_SERVICE_API_KEY    ucode key for copilot_conversations / copilot_audit.
#                            Its own key, not the one the SPA ships in its
#                            bundle — this is what signs the audit trail.
#   HRMS_EMPLOYEE_ROLE_ID    role id that marks a user_base row as an employee
#   UCODE_BASE_URL           https://api.admin.u-code.io
#   UCODE_PROJECT_ID         9a462573-ce11-4288-928a-a6ba754b6998. Only the
#                            fallback now: the panel names its own project in a
#                            Project-Id header, and this is what a request
#                            without one gets. It also stays the fixed project
#                            of the Copilot's own conversations and audit rows,
#                            which the service API key is issued against.
#   UCODE_ENVIRONMENT_ID     2f73835f-3a29-46c8-951e-75119db9bfc0
#   CORS_ORIGINS             origin of the HRMS admin panel. The service refuses
#                            every other origin, and its default is
#                            http://localhost:5199 — omit this and the browser
#                            gets a CORS error that reads as the service being
#                            down.
#   COPILOT_MODEL            claude-sonnet-5
#   COPILOT_EFFORT           high
#   BILLING_SERVICE_SECRET   shared with udevs-hrms-billing; signs AI usage
#                            records (billing_ai_usage_record). Same value in
#                            both places, else usage is silently not reported.
#   TELEGRAM_BOT_TOKEN       the HRMS bot, same token the notifications are sent
#                            with. Absent means the bot surface is off and the
#                            panel is unaffected.
#   TELEGRAM_WEBHOOK_SECRET  any long random string. Handed to Telegram by
#                            set-webhook.ts and echoed back on every delivery —
#                            the webhook URL is public, so this header is the
#                            only proof an update came from Telegram.
#   HRMS_WEB_URL             https://hrms.u-code.io — base for the "open in
#                            HRMS" buttons. Without it those buttons are
#                            dropped, because Telegram refuses a relative url.
#
# Turning the bot on is a deliberate sequence, NOT a deploy: the bot has one
# update queue, and hickvision polls it today for group and phone binding.
# hickvision ships FIRST (it gains the telegram_updates method the webhook
# forwards to), then this service, then set-webhook.ts, and only then
# hickvision again with TELEGRAM_POLLING=0. See README, "The Telegram bot".
#
# PORT stays below on purpose: it has to agree with the two port numbers in
# this same file, and a mismatch is silent — the pod starts and the ingress
# routes to nothing.
environment:
  PORT: "8080"

volumes:
  enabled: false
  pvc:
    enabled: false

# HTTP only — no gRPC surface on this service.
service:
  type: ClusterIP
  annotations: {}
  specs:
    - port: 8080
      targetPort: 8080
      name: http

ingress:
  enabled: true
  rules:
    - annotations:
        kubernetes.io/ingress.class: nginx
        acme.cert-manager.io/http01-edit-in-place: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
        # CORS is enforced by the service itself against CORS_ORIGINS, so the
        # ingress does not add its own permissive header here.
        #
        # Answers stream over SSE and a long one runs for minutes: the default
        # 60s proxy read timeout would cut a reply mid-sentence, and buffering
        # would hold the whole stream back and deliver it at once, which looks
        # exactly like the Copilot hanging.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
      type: web
      hosts:
        # Named for what it is: this service only speaks HRMS, so the
        # platform-wide copilot.u-code.io was considered and left free for a
        # copilot that serves the platform. Follows its neighbours
        # (doc-generator.u-code.io).
        #
        # Two things must match this exactly, or the panel talks to nothing:
        # VITE_COPILOT_URL in the HRMS admin (baked in at build time — a rebuild,
        # not a restart), and CORS_ORIGINS in Vault, which holds the panel's own
        # origin. The browser calls this service directly, not through
        # api.admin.u-code.io.
        #
        # Needs a DNS record pointing at the ingress before the first deploy:
        # cert-manager solves the http01 challenge over this name, so without it
        # the certificate never issues. The name currently answers 404 through
        # the *.u-code.io wildcard, which is not a record and will not satisfy
        # the challenge.
        #
        # Do NOT move this under *.hrms.udevs.io: that wildcard is already
        # claimed by career-site-web-ingress in frontend-prod, so any host under
        # it reaches the career site rather than this service.
        #
        # The panel itself now answers on hrms.ucode.co — its real address since
        # the domain move — and on hrms-admin.u-code.io, which is kept while that
        # settles. Both are hosts of udevs-hrms-admin-web-ingress. Whichever one
        # people open has to appear in CORS_ORIGINS, and that value lives in
        # Vault: changing it here changes nothing.
        - host: "hrms-copilot.u-code.io"
          path: /
          servicePort: 8080
      # Required, and not implied by the cert-manager annotations above.
      # ingress-shim issues a certificate only for hosts listed in an Ingress
      # `tls` block; with the annotations alone it does nothing at all — no
      # Certificate, no Order, no error — and the host quietly serves the
      # ingress controller's fake self-signed certificate instead. The panel
      # calls this service over HTTPS from the browser, so that failure is
      # total and looks like the service being down.
      tls:
        - secretName: hrms-copilot-tls
          hosts:
            - "hrms-copilot.u-code.io"

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: workload
              operator: In
              values:
                - "ucode-prod"
